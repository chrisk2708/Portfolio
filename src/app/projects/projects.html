<section id="projects" class="projects">
    <article class="projects-title">
        <hr class="hr-before">
        <h2>Portfolio</h2>
        <hr>
    </article>
        <p>Explore a selection of my work here - Interact with projects to see my skills in action.</p>
    <article class="projects-wrapper">
        @for (project of projects; track $index) {
            <div class="projects-single-wrapper" [class.reversed]="$odd">
                <img class="projects-img" src="./assets/img/{{ project.imgSrc }}" alt="">
                <div class="projects-info">
                    <h3>{{project.name}}</h3>
                    <p class="projects-prog-lang">{{project.knowledge.join(' | ')}}</p>
                    <p>{{project.description}}</p>
                    <div class="projects-btn">
                        <button class="live-test-btn">Live Test</button>
                        <button class="github-btn">Github</button>
                    </div>
                </div>
            </div>
        }
    </article>
    <img class="shadow-portfolio" src="./assets/img/purple_shadow_portfolio.png" alt="">
</section>
