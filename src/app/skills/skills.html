<section id="skills" class="skills">
    <article class="skill-logos">
        @for (skill of skills; track skill.name) {
            <img [src]="skill.icon" [alt]="skill.name + ' icon'">
        }
    </article>
    <article class="skill-text">
        <h2>My Skills</h2>
        <p>Show that you have used a variety of
            front-end technologies in your projects.</p>
        <h3>Looking for <span>another skill</span>?</h3>
        <p>Reveal enthusiasm for learning new technologies and frameworks.</p>
        <button>Get in touch</button>
    </article>
        <img class="shadow-skills" src="./assets/img/green_shadow_skills_portfolio.png" alt="">
        <hr>
</section>
