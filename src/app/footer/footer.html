<footer class="footer">
  <div class="footer-wrapper">
    <div class="footer-logo">
      <a routerLink="/" aria-label="Home">
        <img src="./assets/img/logo.svg" alt="Logo Christian Sobotta" width="216" />
      </a>
      <nav class="legal-links">
        <a routerLink="/imprint">{{ i18n.t('footer.legal') }}</a>
        <a routerLink="/privacy">{{ i18n.t('footer.privacy') }}</a>
      </nav>
    </div>

    <p class="copyright">&copy; Christian Sobotta {{ year }}</p>

    <div class="footer-links">
      <a
        href="https://github.com/chrisk2708"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="i18n.t('footer.github')"
      >
        <img src="./assets/icons/github_btn.png" alt="" width="30" height="30" />
      </a>
      <a href="mailto:chris.k2708@gmail.com" [attr.aria-label]="i18n.t('footer.email')">
        <img src="./assets/icons/email_btn.png" alt="" width="30" height="30" />
      </a>
      <a
        href="https://www.linkedin.com/in/christian-sobotta-16786b450/"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="i18n.t('footer.linkedin')"
      >
        <img src="./assets/icons/linkedin_btn.png" alt="" width="30" height="30" />
      </a>
    </div>
  </div>
</footer>
