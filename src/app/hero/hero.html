<section class="hero">
  <div class="content-wrapper">
    <div class="hero-foto">
      <img class="hero-wave" src="./assets/img/wave.webp" alt="" />
      <div class="foto-box">
        <img class="hero-shadow" src="./assets/img/shadow-hero-foto.webp" alt="" />
        <img
          class="hero-img"
          src="./assets/img/hero-foto.webp"
          [alt]="i18n.t('hero.photoAlt')"
          width="900"
          height="1183"
        />
      </div>
    </div>
    <div class="hero-name">
      <h1 class="name" [class.lang-de]="i18n.lang() === 'DE'">
        <span class="vertical-text">{{ i18n.t('hero.iam') }}</span>
        <span class="full-name">
          <span>Christian</span>
          <span>Sobotta</span>
        </span>
        <span class="activity">{{ i18n.t('hero.role') }}</span>
      </h1>
      <a class="cta" routerLink="/" fragment="contact">{{ i18n.t('hero.cta') }}</a>
    </div>
  </div>

  <div class="hero-content">
    <div class="hero-contact-btn">
      <span class="line"></span>
      <a
        href="https://github.com/chrisk2708"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="i18n.t('footer.github')"
      >
        <img src="./assets/icons/github_btn.png" alt="" />
      </a>
      <a routerLink="/" fragment="contact" [attr.aria-label]="i18n.t('nav.contact')">
        <img src="./assets/icons/email_btn.png" alt="" />
      </a>
      <a
        href="https://www.linkedin.com/in/christian-sobotta"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="i18n.t('footer.linkedin')"
      >
        <img src="./assets/icons/linkedin_btn.png" alt="" />
      </a>
      <a class="email" href="mailto:chris.k2708@gmail.com">chris.k2708&#64;gmail.com</a>
    </div>

    <a class="hero-scroll-down" routerLink="/" fragment="about">
      <span>{{ i18n.t('hero.scroll') }}</span>
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M13 16.172L17.657 11.515C18.0475 11.1245 18.6806 11.1245 19.071 11.515C19.4615 11.9055 19.4615 12.5385 19.071 12.929L12.7072 19.2929C12.3166 19.6834 11.6835 19.6834 11.2929 19.2929L4.92905 12.929C4.53858 12.5385 4.53858 11.9055 4.92905 11.515C5.31951 11.1245 5.95258 11.1245 6.34305 11.515L11 16.172V5C11 4.44772 11.4478 4 12 4C12.5523 4 13 4.44772 13 5V16.172Z"
          fill="white"
        />
      </svg>
    </a>
  </div>
</section>
