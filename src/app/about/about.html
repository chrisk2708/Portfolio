<section id="about" class="about">
  <img class="shadow-about" src="./assets/img/shadow_about_me.webp" alt="" />
  <div class="about-text">
    <h2>{{ i18n.t('about.title') }}</h2>
    <p>{{ i18n.t('about.intro') }}</p>
    <ul>
      <li>
        <img src="./assets/icons/location.png" alt="" width="48" height="48" />
        <p>{{ i18n.t('about.location') }}</p>
      </li>
      <li>
        <img src="./assets/icons/bulb.png" alt="" width="48" height="48" />
        <p>{{ i18n.t('about.learning') }}</p>
      </li>
      <li>
        <img src="./assets/icons/puzzle.png" alt="" width="48" height="48" />
        <p>{{ i18n.t('about.problem') }}</p>
      </li>
    </ul>
  </div>
  <div class="about-foto">
    <div class="foto-circle">
      <img
        src="./assets/img/about-foto.webp"
        [alt]="i18n.t('about.photoAlt')"
        width="510"
        height="510"
      />
    </div>
    <span class="line"></span>
  </div>
</section>
